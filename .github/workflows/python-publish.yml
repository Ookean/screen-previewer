# Save this file as: .github/workflows/build-exe.yml
# (in your repo, create the folders .github/workflows/ if they don't exist yet,
#  and put screen_preview.py in the repo root - or adjust the path below)
#
# This workflow builds a standalone Windows .exe from screen_preview.py
# using PyInstaller, and uploads it as a downloadable build artifact.
#
# How to get the .exe after pushing:
#   1. Go to your repo on GitHub -> "Actions" tab
#   2. Click the latest workflow run
#   3. Scroll down to "Artifacts" and download "screen-preview-exe"
#   4. Unzip it - inside you'll find screen_preview.exe, ready to run on Windows,
#      no Python install required.
#
# It also builds automatically whenever you push a tag like "v1.0.0",
# and attaches the exe to a GitHub Release for easy sharing.

name: Build Windows Executable

on:
  push:
    branches: [ main ]
    paths:
      - 'screen_preview.py'
      - '.github/workflows/build-exe.yml'
    tags:
      - 'v*'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mss pillow pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name screen_preview screen_preview.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: screen-preview-exe
          path: dist/screen_preview.exe

      # Optional: attach the exe to a GitHub Release when you push a version tag
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/screen_preview.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
