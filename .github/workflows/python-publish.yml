name: Build Windows Executable and Installer
on:
  push:
    branches: [ main ]
    paths:
      - 'screen_preview.py'
      - 'installer.iss'
      - 'requirements.txt'
      - 'tools/gen_licenses.py'
      - '.github/workflows/build-exe.yml'
    tags:
      - 'v*'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Generate third-party license file
        run: python tools/gen_licenses.py

      - name: Stamp version (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          (Get-Content screen_preview.py) -replace 'APP_VERSION = ".*"', "APP_VERSION = `"$v`"" |
            Set-Content screen_preview.py

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name screen_preview screen_preview.py --icon=icon.ico --add-data "THIRD_PARTY_LICENSES.txt;." --add-data "PRIVACY.md;."

      - name: Upload raw exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: screen-preview-exe
          path: dist/screen_preview.exe

      # --- Installer packaging ---

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: screen-preview-installer
          path: installer_output/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/screen_preview.exe
            installer_output/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}